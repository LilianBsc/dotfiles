active_model = "ZAI GLM 5.3"
applied_migrations = [
    "bash_read_only_defaults_v1",
]
connectors = [
    { name = "google_drive_mcp", disabled_tools = [] },
    { name = "github_app", disabled = false },
]
installed_agents = [
    "lean",
]

[tools.bash]
allowlist = [
    "basename",
    "cat",
    "cd",
    "comm",
    "cut",
    "date",
    "diff",
    "dirname",
    "du",
    "echo",
    "file",
    "find",
    "fmt",
    "fold",
    "git diff",
    "git log",
    "git status",
    "grep",
    "head",
    "join",
    "less",
    "ls",
    "md5sum",
    "more",
    "nl",
    "od",
    "paste",
    "pwd",
    "readlink",
    "sha1sum",
    "sha256sum",
    "shasum",
    "sort",
    "stat",
    "sum",
    "tac",
    "tail",
    "tr",
    "tree",
    "uname",
    "uniq",
    "uv run python",
    "vibe",
    "wc",
    "which",
    "whoami",
]

[tools.web_fetch]
allowlist = [
    "github.com",
]

[tools.web_search]
permission = "always"

