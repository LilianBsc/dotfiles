[[mcp_servers]]
name = "gitlab"
transport = "stdio"
command = "bash"
args = [
    "-c",
    "set -a; source \"$HOME/.vibe/.env\"; set +a; exec npx -y @zereight/mcp-gitlab",
]
startup_timeout_sec = 30

[[models]]
name = "mistral-small-latest"
provider = "mistral"
alias = "Mistral Small"
thinking = "high"

[[models]]
name = "zai-glm-5-3"
provider = "mistral"
alias = "ZAI GLM 5.3"
thinking = "high"
